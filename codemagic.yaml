workflows:
  ios-unsigned-build:
    name: Build Unsigned IPA
    instance_type: mac_mini_m2
    cache:
      cache_paths:
        # Cache SPM package checkouts so they aren't re-fetched and re-compiled
        # on every run. Invalidated automatically when Package.resolved changes.
        - build/SourcePackages
        # Cache compiled dependency products so unchanged packages aren't rebuilt.
        - build/Build/Products/Release-iphoneos
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
    scripts:
      - name: Build Unsigned App
        script: |
          xcodebuild build \
            -project IceCubesApp.xcodeproj \
            -scheme IceCubesApp \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENTITLEMENTS_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
      - name: Package to IPA
        script: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "IceCubesApp.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find IceCubesApp.app directory."
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r IceCubesApp-Unsigned.ipa Payload
    artifacts:
      - "*.ipa"
