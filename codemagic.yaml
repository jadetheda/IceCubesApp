workflows:
  ios-unsigned-build:
    name: Build Unsigned IPA
    instance_type: mac_pro_m2
    cache:
      cache_paths:
        - build/SourcePackages
        - build/Build/Products/Release-iphoneos
        - build/Build/Intermediates.noindex
    environment:
      xcode: "26.4"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
    scripts:
      - name: Build Unsigned App
        script: |
          xcodebuild build \
            -project IceCubesApp.xcodeproj \
            -scheme IceCubesApp \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENTITLEMENTS_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf
      - name: Package to IPA
        script: |
          mkdir -p Payload
          APP_PATH=$(find build -name "Ice Cubes.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find Ice Cubes.app under build/"
            find build/Build -maxdepth 4 -type d 2>/dev/null
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r IceCubesApp-Unsigned.ipa Payload
    artifacts:
      - "*.ipa"
