name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Swift Packages
        run: xcodebuild -resolvePackageDependencies -project IceCubesApp.xcodeproj -scheme IceCubesApp

      - name: Build Archive (Unsigned)
        run: |
          xcodebuild archive \
            -project IceCubesApp.xcodeproj \
            -scheme IceCubesApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/IceCubesApp.xcarchive \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -destination "generic/platform=iOS"

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/IceCubesApp.xcarchive/Products/Applications/IceCubesApp.app Payload/
          zip -qr IceCubesApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IceCubesApp-Unsigned-IPA
          path: IceCubesApp.ipa
