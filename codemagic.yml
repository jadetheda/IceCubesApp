workflows:
  ios-unsigned-build:
    name: Build Unsigned IPA
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
    scripts:
      - name: Build Unsigned App
        script: |
          xcodebuild clean build \
            -project IceCubesApp.xcodeproj \
            -scheme IceCubesApp \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
            
      - name: Package to IPA
        script: |
          mkdir -p Payload
          # BUG FIX: Search explicitly for the main app bundle, avoiding extensions
          APP_PATH=$(find build -name "IceCubesApp.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find IceCubesApp.app directory."
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r IceCubesApp-Unsigned.ipa Payload
          
    artifacts:
      # OPTIMIZATION: Use a pattern string in case the file name changes
      - "*.ipa"
